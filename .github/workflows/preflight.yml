name: Preflight 门禁

on:
  push:
    branches: [feat/edgeone, main]
  pull_request:
    branches: [main]
  # 密钥审计是"会随时间腐化"的检查(依赖轮换/平台变更), 必须定时重跑,
  # 不能只在有人推代码时才看 —— 每周一 01:00 UTC(09:00 CST)
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  frontend:
    name: 前端 lint/tsc/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd frontend && npm ci --no-audit --no-fund
      - run: cd frontend && npm run lint
      - run: cd frontend && npx prettier --check "src/**/*.{ts,tsx,css}"
      - run: cd frontend && npx tsc --noEmit
      - run: cd frontend && npm test
      # 红线 B 必须是"每推必跑", 否则只剩文档里的一句话 —— 与本地 preflight [8/8] 同一脚本
      - name: i18n 判定自检(正负例 —— 防止扫描规则改坏后"什么都查不出"仍 PASS)
        run: python3 scripts/i18n_audit.py --selftest
      - name: i18n 门禁(中文硬编码为零 + zh/en 键集合相等 + 无死引用)
        run: python3 scripts/i18n_audit.py --gate

  backend:
    name: 后端回归/审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-python 偶发 "Unexpected HTTP response: 504"（GitHub 侧拉 Python 版本清单
      # 超时；2026-11-08~09 的红有近一半是它，跟代码无关）。两条保险：
      #   ① 升 v7（原生 node24，不再被强制迁移，消掉那条 deprecation 注解）；
      #   ② `continue-on-error` + 下一步的版本断言 —— 拉不到 3.10 就回落 runner 预装的
      #      python3(≥3.12)，**不允许静默降到 3.10 以下**（本地 preflight 已按 3.10 语法校验）。
      - id: py
        uses: actions/setup-python@v7
        continue-on-error: true
        with:
          python-version: '3.10'
      # 依赖装进 venv：既避开 PEP 668(externally-managed-environment)，也让"回落系统
      # python"时 pip 仍然可用；后续步骤的 python3 从 PATH 里拿 venv 那一份。
      - name: 安装后端依赖(venv 隔离, 兼容 setup-python 失败回落)
        run: |
          python3 -V
          python3 -c "import sys; assert sys.version_info >= (3, 10), 'needs Python >= 3.10'"
          echo "setup-python outcome = ${{ steps.py.outcome }}"
          python3 -m venv .venv
          .venv/bin/python -m pip install -q --upgrade pip
          .venv/bin/pip install -q -r cloud-functions/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # 校验器自身的正负例(不需要库): 防止有人改坏 explain_sql/classify_error 后
      # 冒烟"什么都验不出"却仍然报绿
      - run: cd cloud-functions/api && python3 sql_smoke.py --self-test
      # 数据库连接**不在 GitHub 里维护第二份**: 运行时从 EdgeOne 项目环境变量取,
      # 线上用哪个库 CI 就验哪个库。改密码只改 EdgeOne 一处。
      # 拉不到(fork PR 无 secret / token 失效)时回落到下面 FB_* 的旧副本, 只告警不失败。
      - name: 解析数据库连接(EdgeOne 环境变量优先)
        env:
          EDGEONE_PAGES_API_TOKEN: ${{ secrets.EDGEONE_PAGES_API_TOKEN }}
          # ProjectId 不是秘密(拿到它还得有 token 才能调), 但它存在 .edgeone/ 里,
          # 而那个目录是 gitignore 的 —— 不显式传进来, CI 就只会报"无 ProjectId"
          # 然后悄悄回落到旧 secrets(第一次改完就是这样, 白跑一趟)。
          EDGEONE_PROJECT_ID: makers-8gstkvheqm2c
          FB_HOST: ${{ secrets.TIDB_HOST }}
          FB_PORT: ${{ secrets.TIDB_PORT }}
          FB_USER: ${{ secrets.TIDB_USER }}
          FB_PASS: ${{ secrets.TIDB_PASSWORD }}
          FB_DB: ${{ secrets.TIDB_DB }}
        run: python3 scripts/ci_fetch_env.py
      - name: 后端回归(+ 真实 SQL 冒烟)
        run: |
          cd cloud-functions/api
          if [ -n "$TIDB_HOST" ]; then
            echo "凭据来源=$CI_ENV_SOURCE → 同时做真实 SQL 冒烟(EXPLAIN + schema 对账)"
            python3 local_test.py --sql-smoke
          else
            echo "::warning title=真实 SQL 冒烟未执行::未取到数据库连接 —— 本轮 CI 没有验证表名/列名"
            python3 local_test.py
          fi
      - run: cd cloud-functions/api && python3 test_audit.py

  secrets:
    name: 密钥审计(含 git 全历史)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 是硬要求 —— 浅克隆只能扫到最近若干提交, 而密钥泄露
      # 往往发生在很久以前(删了文件也还在 .git 里)。脚本会检测浅克隆并告警。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 这个 job 只用标准库(re + subprocess + git)，不需要 setup-python ——
      # 去掉一次"下载 Python 版本清单"就少一个 504 的失败面(2026-11-08 红过一次)。
      - name: 确认 python3 可用(≥3.10, runner 预装)
        run: |
          python3 -V
          python3 -c "import sys; assert sys.version_info >= (3, 10), 'needs Python >= 3.10'"
      - name: 检测规则自检(正负例 —— 防止改模式后"什么都抓不到"或"天天误报")
        run: python3 scripts/audit_secrets.py --selftest
      - name: 跑审计(硬编码 / .env 跟踪 / .gitignore / 历史 blob + commit message + reflog)
        run: python3 scripts/audit_secrets.py
      - name: 确认历史确实扫全了(浅克隆会让上一步"通过"变得没有意义)
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "::error::仓库是浅克隆, 历史扫描不完整 —— 检查 fetch-depth: 0"
            exit 1
          fi
          echo "完整历史: $(git rev-list --all --count) 个提交"

  notify:
    name: 失败通知
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: echo "preflight 失败(webhook 通知待配置)"

name: Preflight 门禁

on:
  push:
    branches: [feat/edgeone, main]
  pull_request:
    branches: [main]
  # 密钥审计是"会随时间腐化"的检查(依赖轮换/平台变更), 必须定时重跑,
  # 不能只在有人推代码时才看 —— 每周一 01:00 UTC(09:00 CST)
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  frontend:
    name: 前端 lint/tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd frontend && npm ci --no-audit --no-fund
      - run: cd frontend && npm run lint
      - run: cd frontend && npx prettier --check "src/**/*.{ts,tsx,css}"
      - run: cd frontend && npx tsc --noEmit

  backend:
    name: 后端回归/审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r cloud-functions/requirements.txt
      - run: cd cloud-functions/api && python3 local_test.py
      - run: cd cloud-functions/api && python3 test_audit.py

  secrets:
    name: 密钥审计(含 git 全历史)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 是硬要求 —— 浅克隆只能扫到最近若干提交, 而密钥泄露
      # 往往发生在很久以前(删了文件也还在 .git 里)。脚本会检测浅克隆并告警。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 检测规则自检(正负例 —— 防止改模式后"什么都抓不到"或"天天误报")
        run: python3 scripts/audit_secrets.py --selftest
      - name: 跑审计(硬编码 / .env 跟踪 / .gitignore / 历史 blob + commit message + reflog)
        run: python3 scripts/audit_secrets.py
      - name: 确认历史确实扫全了(浅克隆会让上一步"通过"变得没有意义)
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "::error::仓库是浅克隆, 历史扫描不完整 —— 检查 fetch-depth: 0"
            exit 1
          fi
          echo "完整历史: $(git rev-list --all --count) 个提交"

  notify:
    name: 失败通知
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: echo "preflight 失败(webhook 通知待配置)"

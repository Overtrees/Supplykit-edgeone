name: CI

on:
  push:
    branches: [feat/edgeone, main]
  pull_request:

jobs:
  backend:
    name: Backend 回归+审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装后端依赖
        run: pip install -r cloud-functions/requirements.txt
      - name: 本地回归(103 项: 路由契约 + 分级边界 + MOQ 聚合 + SQL/缓存审计)
        run: |
          cd cloud-functions/api
          python3 local_test.py
      - name: 工程审计(双包裹防线 + 缓存 key 完整性 + except pass 基线)
        run: |
          cd cloud-functions/api
          python3 test_audit.py

  frontend:
    name: Frontend 类型+构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安装前端依赖
        run: |
          cd frontend
          npm install --no-save @rollup/rollup-linux-x64-gnu 2>/dev/null
          npm install
      - name: 类型检查
        run: cd frontend && npx tsc --noEmit --skipLibCheck
      - name: 生产构建
        run: cd frontend && npx vite build
